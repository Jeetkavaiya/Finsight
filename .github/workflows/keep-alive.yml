name: Keep FinSight Alive

# Two jobs in one:
#  1. Query Supabase (via the Render backend) so the free-tier project is never
#     idle for 7 days and paused.
#  2. Re-enable this workflow through the GitHub API, which resets GitHub's
#     60-day "no repository activity" timer that silently disabled it before.

on:
  schedule:
    - cron: "17 9 * * *"   # daily; Supabase pauses after 7 idle days
  workflow_dispatch: {}     # manual trigger from the Actions tab

permissions:
  actions: write            # needed to call the "enable workflow" API
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and query Supabase
        env:
          BACKEND_URL: https://finsight-api-7nw1.onrender.com
        run: |
          # Render free instances can take ~1 min to cold-start, so retry.
          curl -sS --fail --retry 6 --retry-delay 20 --retry-all-errors \
            --max-time 90 -o /dev/null -w "health status: %{http_code}\n" \
            "$BACKEND_URL/health"

          # /db-ping runs SELECT count(*) FROM chunks directly. It does not
          # call Gemini, so an LLM outage can no longer skip the DB hit.
          # --fail makes the job go red if Supabase is unreachable or paused.
          curl -sS --fail --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 60 -w "\ndb-ping status: %{http_code}\n" \
            "$BACKEND_URL/db-ping"

  keep-workflow-enabled:
    runs-on: ubuntu-latest
    if: ${{ always() }}      # run even if the ping failed
    steps:
      - name: Reset GitHub's 60-day inactivity timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
          echo "Workflow re-enabled; inactivity counter reset."
