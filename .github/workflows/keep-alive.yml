name: Keep FinSight Alive

on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and query the backend
        run: |
          # Replace with your actual Render backend URL (no trailing slash)
          BACKEND_URL="https://finsight-api-7nw1.onrender.com"

          echo "Hitting /health first to wake a sleeping Render instance..."
          curl -s -o /dev/null -w "health status: %{http_code}\n" "$BACKEND_URL/health" || true

          echo "Waiting 45s in case the service was cold-starting..."
          sleep 45

          echo "Sending a real /query request so Supabase sees DB activity..."
          curl -s -X POST "$BACKEND_URL/query" \
            -H "Content-Type: application/json" \
            -d '{"question": "What are Apple main revenue segments"}' \
            -w "\nquery status: %{http_code}\n"